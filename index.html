<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>⚽ WM 2026 Tippspiel · Papa vs. Elisa</title>
<style>
  :root{
    --bg:#0a1a2f; --card:#11253f; --accent:#fab919; --accent2:#2364aa;
    --text:#f4f7fb; --sub:#9db4cf; --line:#1d3a5c; --win:#16c79a; --danger:#5c1d28;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,sans-serif;padding:16px 14px 60px}
  .wrap{max-width:560px;margin:0 auto}
  .center{text-align:center}
  .card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:16px;border:1px solid var(--line)}
  .title{font-size:34px;font-weight:900;letter-spacing:-1px}
  .sub{color:var(--sub);font-size:13px}
  button{font-family:inherit}
  .tab{padding:8px 13px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:13px;
    background:var(--line);color:var(--sub);transition:all .15s}
  .tab.active{background:var(--accent);color:#0a1a2f}
  select,input{width:100%;padding:12px;border-radius:10px;background:var(--line);color:var(--text);
    border:none;font-size:15px}
  .big{font-size:30px;font-weight:900;color:var(--accent)}
  .label{color:var(--sub);font-size:13px;font-weight:600}
  .save{font-size:11px;font-weight:600;margin-top:6px}
  .pillbtn{flex:1;padding:10px;border-radius:10px;border:none;cursor:pointer;font-weight:800;font-size:15px;
    background:var(--line);color:var(--sub)}
  .pillbtn.active{background:var(--accent);color:#0a1a2f}
  .gold{color:var(--accent)}
  .login-box{max-width:360px;margin:60px auto 0}
  .primary{width:100%;padding:14px;border-radius:12px;border:none;cursor:pointer;
    font-weight:800;font-size:16px;background:var(--accent);color:#0a1a2f;margin-top:12px}
  .err{color:#ffb3b3;font-size:13px;margin-top:8px;min-height:18px}
  .match{padding:10px 0;border-bottom:1px solid var(--line)}
  .matchtop{display:flex;align-items:center;gap:8px}
  .team-h{flex:1;text-align:right;font-size:14px}
  .team-a{flex:1;text-align:left;font-size:14px}
  .scorein{width:46px;min-width:46px;text-align:center;padding:10px 4px;font-size:17px;font-weight:800}
  .vs{color:var(--sub);font-size:12px}
  .meta{font-size:11px;color:var(--sub);text-align:center;margin-bottom:4px}
  .pts{font-size:11px;font-weight:700;margin-left:6px;padding:2px 6px;border-radius:6px}
  .pts.hit4{background:var(--win);color:#062}
  .pts.hit3{background:#3a8;color:#fff}
  .pts.hit2{background:var(--accent2);color:#fff}
  .pts.hit0{background:var(--line);color:var(--sub)}
  .res{font-size:11px;color:var(--sub);text-align:center;margin-top:3px}
  .res b{color:var(--text)}
  .grpnav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;justify-content:center}
  .gbtn{min-width:34px;height:34px;padding:0 8px;border-radius:9px;border:none;cursor:pointer;font-weight:800;font-size:13px;
    background:var(--line);color:var(--sub)}
  .gbtn.active{background:var(--accent);color:#0a1a2f}
  .override{font-size:11px;color:var(--accent);text-align:center;margin-top:3px;cursor:pointer;text-decoration:underline}
  .pending{opacity:.55}
  .pendtag{font-size:11px;color:var(--sub);text-align:center;margin-top:3px;font-style:italic}
</style>
</head>
<body>
<div class="wrap" id="app">Lädt…</div>

<script>
// ─────────────────────────────────────────────────────────────
//  STATISCHE DATEN (Extras)
// ─────────────────────────────────────────────────────────────
const ALL_TEAMS=["Algerien","Argentinien","Australien","Belgien","Bosnien-Herz.","Brasilien","Curaçao","DR Kongo","Deutschland","Ecuador","Elfenbeinküste","England","Frankreich","Ghana","Haiti","Iran","Irak","Japan","Jordanien","Kanada","Kap Verde","Katar","Kolumbien","Kroatien","Marokko","Mexiko","Neuseeland","Niederlande","Norwegen","Panama","Paraguay","Portugal","Saudi-Arabien","Schottland","Schweden","Schweiz","Senegal","Spanien","Südafrika","Südkorea","Tschechien","Tunesien","Türkei","USA","Uruguay","Usbekistan","Ägypten","Österreich"];
const FLAG={"Algerien":"🇩🇿","Argentinien":"🇦🇷","Australien":"🇦🇺","Belgien":"🇧🇪","Bosnien-Herz.":"🇧🇦","Brasilien":"🇧🇷","Curaçao":"🇨🇼","DR Kongo":"🇨🇩","Deutschland":"🇩🇪","Ecuador":"🇪🇨","Elfenbeinküste":"🇨🇮","England":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","Frankreich":"🇫🇷","Ghana":"🇬🇭","Haiti":"🇭🇹","Iran":"🇮🇷","Irak":"🇮🇶","Japan":"🇯🇵","Jordanien":"🇯🇴","Kanada":"🇨🇦","Kap Verde":"🇨🇻","Katar":"🇶🇦","Kolumbien":"🇨🇴","Kroatien":"🇭🇷","Marokko":"🇲🇦","Mexiko":"🇲🇽","Neuseeland":"🇳🇿","Niederlande":"🇳🇱","Norwegen":"🇳🇴","Panama":"🇵🇦","Paraguay":"🇵🇾","Portugal":"🇵🇹","Saudi-Arabien":"🇸🇦","Schottland":"🏴󠁧󠁢󠁳󠁣󠁴󠁿","Schweden":"🇸🇪","Schweiz":"🇨🇭","Senegal":"🇸🇳","Spanien":"🇪🇸","Südafrika":"🇿🇦","Südkorea":"🇰🇷","Tschechien":"🇨🇿","Tunesien":"🇹🇳","Türkei":"🇹🇷","USA":"🇺🇸","Uruguay":"🇺🇾","Usbekistan":"🇺🇿","Ägypten":"🇪🇬","Österreich":"🇦🇹"};
const FUN=[
  {id:"f1",q:"Welches Team kassiert das erste Eigentor des Turniers? 🤦",type:"team"},
  {id:"f2",q:"Wie viele rote Karten gibt es im Finale? 🟥",type:"number"},
  {id:"f3",q:"Welcher Trainer fliegt als Erster vor Wut aus seinem Anzug? 👔🔥",type:"text"},
  {id:"f4",q:"Welches Maskottchen ist am peinlichsten? 🦊",type:"text"},
  {id:"f5",q:"In welcher Minute fällt das schnellste Tor des Turniers? ⚡",type:"number"},
  {id:"f6",q:"Welcher Spieler weint zuerst vor laufender Kamera? 😭",type:"text"},
  {id:"f7",q:"Wie oft sagt der Kommentator 'unfassbar'? 🎙️",type:"number"},
  {id:"f8",q:"Welches Team hat die schönsten Trikots? 👕✨",type:"team"},
  {id:"f9",q:"Wer verschießt im Elfmeterschießen am dramatischsten? 💔",type:"text"},
  {id:"f10",q:"Welche Nationalhymne wird am lautesten mitgesungen? 🎵",type:"team"},
];
const KO_ORDER=["Sechzehntelfinale","Achtelfinale","Viertelfinale","Halbfinale","Spiel um Platz 3","Finale"];

// ─────────────────────────────────────────────────────────────
//  ZUSTAND
// ─────────────────────────────────────────────────────────────
let me=null, secret="", tab="spiele", viewPlayer="Papa", adminMode=false, saveTimer=null;
let curGroup="A", curRound="Sechzehntelfinale";
let state={ tips:{}, results:{} };
let SCHEDULE=[], KO=[], scheduleErr="";
const API="/api/tipps", SCHED="/api/schedule";

function myTips(){
  if(!state.tips[me]) state.tips[me]={matchTips:{},koTips:{},championTip:"",topScorer:"",funTips:{}};
  const t=state.tips[me];
  if(!t.matchTips)t.matchTips={}; if(!t.koTips)t.koTips={}; if(!t.funTips)t.funTips={};
  return t;
}
function realResult(m){
  const ov=state.results.overrides?.[m.id];
  if(ov && ov.h!=="" && ov.a!=="" && ov.h!=null && ov.a!=null) return {h:+ov.h,a:+ov.a,src:"override"};
  if(m.result) return {h:m.result.h,a:m.result.a,src:"auto"};
  return null;
}

// ─────────────────────────────────────────────────────────────
//  SERVER
// ─────────────────────────────────────────────────────────────
async function loadState(){
  try{const r=await fetch(API);state=await r.json();
    if(!state.tips)state.tips={}; if(!state.results)state.results={};
    if(!state.results.overrides)state.results.overrides={};
  }catch(e){console.error(e);}
}
async function loadSchedule(){
  try{
    const r=await fetch(SCHED); const d=await r.json();
    if(d.matches&&d.matches.length){SCHEDULE=d.matches;KO=d.ko||[];scheduleErr="";}
    else {scheduleErr="Spielplan konnte nicht geladen werden.";}
  }catch(e){scheduleErr="Spielplan konnte nicht geladen werden.";console.error(e);}
}
let saving=false;
async function saveTips(){
  saving=true;renderSaveStatus();
  try{await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({player:me,secret,tips:myTips()})});}catch(e){console.error(e);}
  saving=false;renderSaveStatus();
}
async function saveResults(){
  saving=true;renderSaveStatus();
  try{await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({player:me,secret,mode:"results",results:state.results})});}catch(e){console.error(e);}
  saving=false;renderSaveStatus();
}
function queueSave(fn){clearTimeout(saveTimer);saveTimer=setTimeout(fn,500);}

// ─────────────────────────────────────────────────────────────
//  PUNKTE  (4 exakt / 3 Differenz / 2 Tendenz) – gilt für Gruppen UND K.-o.
// ─────────────────────────────────────────────────────────────
function matchPoints(tip, real){
  if(!tip||!real)return null;
  if(tip.h===""||tip.a===""||tip.h==null||tip.a==null)return null;
  const th=+tip.h,ta=+tip.a,rh=+real.h,ra=+real.a;
  if([th,ta,rh,ra].some(isNaN))return null;
  if(th===rh&&ta===ra)return 4;
  if((th-ta)===(rh-ra))return 3;
  const s=x=>x>0?1:x<0?-1:0;
  if(s(th-ta)===s(rh-ra))return 2;
  return 0;
}
function score(player){
  const t=state.tips[player]; if(!t)return 0;
  let pts=0;
  SCHEDULE.forEach(m=>{const p=matchPoints(t.matchTips?.[m.id], realResult(m));if(p!=null)pts+=p;});
  KO.forEach(m=>{const p=matchPoints(t.koTips?.[m.id], realResult(m));if(p!=null)pts+=p;});
  if(state.results.champion&&t.championTip===state.results.champion)pts+=10;
  if(state.results.topScorer&&t.topScorer&&
     t.topScorer.toLowerCase().trim()===state.results.topScorer.toLowerCase().trim())pts+=8;
  FUN.forEach(fq=>{const r=state.results["fun_"+fq.id], v=t.funTips?.[fq.id];
    if(r&&v&&String(r).toLowerCase().trim()===String(v).toLowerCase().trim())pts+=5;});
  return pts;
}

// ─────────────────────────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────────────────────────
const app=()=>document.getElementById("app");

function renderLogin(err=""){
  app().innerHTML=`
    <div class="center"><div class="title">⚽ WM 2026</div>
      <div class="gold" style="font-weight:800;font-size:18px;margin-top:-4px">Tippspiel</div>
      <div class="sub" style="margin-top:4px">Papa vs. Elisa · 🇺🇸🇨🇦🇲🇽</div></div>
    <div class="card login-box">
      <div class="label" style="margin-bottom:6px">Wer bist du?</div>
      <select id="who"><option value="Papa">👨 Papa</option><option value="Elisa">👧 Elisa</option></select>
      <div class="label" style="margin:12px 0 6px">Dein Geheimwort</div>
      <input id="pw" type="password" placeholder="Geheimwort eingeben" />
      <button class="primary" onclick="doLogin()">Los geht's →</button>
      <div class="err">${err}</div>
    </div>`;
}
async function doLogin(){
  me=document.getElementById("who").value;
  secret=document.getElementById("pw").value;
  app().innerHTML='<div class="center" style="margin-top:80px;color:var(--sub)">⚽ Lade Spielplan & Tipps…</div>';
  await loadState();
  const test=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({player:me,secret,tips:myTips()})});
  if(test.status===401){renderLogin("Falsches Geheimwort. Nochmal versuchen.");return;}
  await loadSchedule();
  viewPlayer=me; renderApp();
}
function renderSaveStatus(){
  const el=document.getElementById("savestatus");
  if(el){el.textContent=saving?"💾 speichert…":"✅ gespeichert";
    el.style.color=saving?"var(--accent)":"var(--win)";}
}
function renderApp(){
  app().innerHTML=`
  <div class="center" style="margin-bottom:18px">
    <div class="title">⚽ WM 2026</div>
    <div class="gold" style="font-weight:800;font-size:18px;margin-top:-4px">Tippspiel</div>
    <div class="sub" style="margin-top:4px">Angemeldet als ${me==="Papa"?"👨 Papa":"👧 Elisa"} · Zeiten in 🇮🇸 isländischer Zeit</div>
    <div class="save" id="savestatus">✅ gespeichert</div>
  </div>
  <div class="card" style="display:flex;justify-content:space-around;text-align:center">
    ${["Papa","Elisa"].map(p=>`<div>
      <div class="label">${p==="Papa"?"👨 Papa":"👧 Elisa"}</div>
      <div class="big">${score(p)}</div><div class="sub">Punkte</div></div>`).join("")}
  </div>
  <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;justify-content:center">
    ${[["spiele","⚽ Gruppen"],["finale","🏆 Finale"],["spezial","⭐ Spezial"],["fun","😂 Lustig"],["regeln","ℹ️ Regeln"]]
      .map(([k,l])=>`<button class="tab ${tab===k?"active":""}" onclick="setTab('${k}')">${l}</button>`).join("")}
  </div>
  <div id="content"></div>`;
  renderContent();
}
function setTab(t){tab=t;renderApp();}
function setView(p){viewPlayer=p;renderContent();}
function setGroup(g){curGroup=g;renderContent();}
function setRound(r){curRound=r;renderContent();}

function playerSwitch(){
  return `<div style="display:flex;gap:8px;margin-bottom:14px">
    ${["Papa","Elisa"].map(p=>`<button class="pillbtn ${viewPlayer===p?"active":""}" onclick="setView('${p}')">
      ${p==="Papa"?"👨 ":"👧 "}${p}</button>`).join("")}
  </div>`;
}

// Eine Spiel-Zeile rendern (für Gruppen und K.-o. gemeinsam)
function matchRow(m, tipObj, readonly, isKO){
  const tip=tipObj?.[m.id]||{h:"",a:""};
  const real=realResult(m);
  const p=matchPoints(tipObj?.[m.id],real);
  const pill=real&&p!=null?`<span class="pts hit${p}">${p} Pkt</span>`:"";
  let resline="";
  if(real){
    const tag=real.src==="override"?" ✏️":"";
    resline=`<div class="res">Endstand: <b>${real.h}:${real.a}</b>${tag} ${pill}</div>`;
  }
  const setter=isKO?"setKO":"setScore";
  const pending=isKO&&m.pending;
  if(pending){
    return `<div class="match pending">
      <div class="meta">${m.date} · ${m.time}${m.ground?" · "+m.ground:""}</div>
      <div class="matchtop">
        <span class="team-h">${m.home} ${m.homeFlag}</span>
        <input class="scorein" disabled value="">
        <span class="vs">:</span>
        <input class="scorein" disabled value="">
        <span class="team-a">${m.awayFlag} ${m.away}</span>
      </div>
      <div class="pendtag">Teams stehen noch nicht fest – tippbar, sobald ausgelost</div>
    </div>`;
  }
  return `<div class="match">
    <div class="meta">${m.date} · ${m.time}${m.ground?" · "+m.ground:""}</div>
    <div class="matchtop">
      <span class="team-h">${m.home} ${m.homeFlag}</span>
      <input class="scorein" type="number" min="0" inputmode="numeric" value="${tip.h}"
        ${readonly?"disabled":""} oninput="${setter}('${m.id}','h',this.value)">
      <span class="vs">:</span>
      <input class="scorein" type="number" min="0" inputmode="numeric" value="${tip.a}"
        ${readonly?"disabled":""} oninput="${setter}('${m.id}','a',this.value)">
      <span class="team-a">${m.awayFlag} ${m.away}</span>
    </div>
    ${resline}
    ${me==="Papa"&&adminMode?`<div class="override" onclick="promptOverride('${m.id}',${isKO})">Ergebnis manuell setzen/ändern</div>`:""}
  </div>`;
}

function renderContent(){
  const c=document.getElementById("content"); if(!c)return;
  const readonly=viewPlayer!==me;

  if(tab==="spiele"){
    if(scheduleErr){c.innerHTML=`<div class="card"><div style="color:#ffb3b3">${scheduleErr}</div>
      <div class="sub" style="margin-top:8px">Bitte später neu laden. Deine bisherigen Tipps sind gespeichert.</div></div>`;return;}
    const t=state.tips[viewPlayer]||{};
    const groups=[...new Set(SCHEDULE.map(m=>m.group))].sort();
    const ms=SCHEDULE.filter(m=>m.group===curGroup);
    c.innerHTML=playerSwitch()+
      `<div class="grpnav">${groups.map(g=>`<button class="gbtn ${curGroup===g?"active":""}" onclick="setGroup('${g}')">${g}</button>`).join("")}</div>`+
      `<div class="card"><div style="font-weight:800;margin-bottom:6px;font-size:16px">Gruppe ${curGroup}</div>
      ${ms.map(m=>matchRow(m,t.matchTips,readonly,false)).join("")}</div>
      <div class="sub center" style="margin-top:-6px">Ergebnisse werden automatisch geladen. ✏️ = von Papa manuell gesetzt.</div>`;
  }

  if(tab==="finale"){
    if(scheduleErr||!KO.length){c.innerHTML=`<div class="card"><div style="color:#ffb3b3">${scheduleErr||"Finalrunde noch nicht verfügbar."}</div></div>`;return;}
    const t=state.tips[viewPlayer]||{};
    const rounds=KO_ORDER.filter(r=>KO.some(m=>m.round===r));
    const ms=KO.filter(m=>m.round===curRound);
    c.innerHTML=playerSwitch()+
      `<div class="grpnav">${rounds.map(r=>`<button class="gbtn ${curRound===r?"active":""}" onclick="setRound('${r}')" style="font-size:11px">${r}</button>`).join("")}</div>`+
      `<div class="card"><div style="font-weight:800;margin-bottom:6px;font-size:16px">${curRound}</div>
      ${ms.map(m=>matchRow(m,t.koTips,readonly,true)).join("")}</div>
      <div class="sub center" style="margin-top:-6px">Tippt das Ergebnis nach 90 Minuten. Gleiche Wertung wie Gruppenspiele (4/3/2).</div>`;
  }

  if(tab==="spezial"){
    const t=state.tips[viewPlayer]||{};
    c.innerHTML=playerSwitch()+`
      <div class="card"><div style="font-weight:800;margin-bottom:6px">🏆 Weltmeister (10 Pkt)</div>
        <select ${readonly?"disabled":""} onchange="setChampion(this.value)">
          <option value="">— Team wählen —</option>
          ${ALL_TEAMS.map(x=>`<option ${t.championTip===x?"selected":""} value="${x}">${FLAG[x]||""} ${x}</option>`).join("")}
        </select></div>
      <div class="card"><div style="font-weight:800;margin-bottom:6px">👟 Torschützenkönig (8 Pkt)</div>
        <input ${readonly?"disabled":""} value="${t.topScorer||""}" placeholder="z.B. Mbappé"
          oninput="setTopScorer(this.value)"></div>`;
  }

  if(tab==="fun"){
    const t=state.tips[viewPlayer]||{};
    c.innerHTML=playerSwitch()+FUN.map(fq=>{
      const v=t.funTips?.[fq.id]||"";
      const field=fq.type==="team"
        ? `<select ${readonly?"disabled":""} onchange="setFun('${fq.id}',this.value)">
             <option value="">— Team wählen —</option>
             ${ALL_TEAMS.map(x=>`<option ${v===x?"selected":""} value="${x}">${FLAG[x]||""} ${x}</option>`).join("")}
           </select>`
        : `<input ${readonly?"disabled":""} type="${fq.type==="number"?"number":"text"}" value="${v}"
             placeholder="Deine Antwort..." oninput="setFun('${fq.id}',this.value)">`;
      return `<div class="card"><div style="font-weight:700;margin-bottom:8px;font-size:15px">
        ${fq.q} <span class="sub">(5 Pkt)</span></div>${field}</div>`;
    }).join("");
  }

  if(tab==="regeln"){
    c.innerHTML=`<div class="card">
      <div style="font-weight:800;margin-bottom:12px;font-size:17px">📖 So funktioniert's</div>
      ${[
        ["⚽ Spiele tippen","Tippe jedes Spiel (Gruppen UND Finalrunde). <b>4 Punkte</b> exakt · <b>3</b> richtige Tordifferenz · <b>2</b> richtige Tendenz."],
        ["🏆 Finalrunde","Vom Sechzehntelfinale bis zum Finale. Getippt wird das Ergebnis nach 90 Minuten. Solange die Teams noch nicht feststehen, sind die Felder gesperrt und schalten sich automatisch frei."],
        ["🔄 Echte Ergebnisse","Werden automatisch aus einer öffentlichen Quelle (openfootball) geladen. Datum/Uhrzeit in isländischer Zeit."],
        ["🏆 Weltmeister","10 Punkte für den richtigen Sieger."],
        ["👟 Torschützenkönig","8 Punkte für den treffsichersten Spieler."],
        ["😂 Lustige Fragen","Je 5 Punkte — hier zählt vor allem der Spaß."],
        ["✏️ Papa als Spielleiter","Falls die Quelle mal hinterherhängt, kann Papa jedes Ergebnis manuell überschreiben."],
      ].map(([t,d])=>`<div style="margin-bottom:14px"><div style="font-weight:700;color:var(--accent)">${t}</div>
        <div class="sub" style="font-size:14px;line-height:1.5">${d}</div></div>`).join("")}
      ${me==="Papa"?`<button class="tab ${adminMode?"active":""}" onclick="toggleAdmin()">
        ${adminMode?"🔒 Spielleiter-Modus aus":"🔓 Spielleiter-Modus an (Ergebnisse & Extras)"}</button>
        <div id="admin">${adminMode?adminPanel():""}</div>`:""}
    </div>`;
  }
}

// ── Eingabe-Handler ───────────────────────────────────────────
function setScore(matchId,side,val){
  const mt=myTips().matchTips; if(!mt[matchId])mt[matchId]={h:"",a:""};
  mt[matchId][side]=val===""?"":Math.max(0,parseInt(val)||0);
  queueSave(saveTips);
}
function setKO(matchId,side,val){
  const kt=myTips().koTips; if(!kt[matchId])kt[matchId]={h:"",a:""};
  kt[matchId][side]=val===""?"":Math.max(0,parseInt(val)||0);
  queueSave(saveTips);
}
function setChampion(v){myTips().championTip=v;queueSave(saveTips);}
function setTopScorer(v){myTips().topScorer=v;queueSave(saveTips);}
function setFun(id,v){myTips().funTips[id]=v;queueSave(saveTips);}

function toggleAdmin(){adminMode=!adminMode;renderContent();}
function promptOverride(matchId,isKO){
  const m=(isKO?KO:SCHEDULE).find(x=>x.id===matchId); if(!m)return;
  const cur=state.results.overrides?.[matchId];
  const def=cur?`${cur.h}:${cur.a}`:(m.result?`${m.result.h}:${m.result.a}`:"");
  const inp=window.prompt(`Ergebnis ${m.home} : ${m.away}\nFormat z.B. 2:1 (leer lassen = Override entfernen)`,def);
  if(inp===null)return;
  if(!state.results.overrides)state.results.overrides={};
  if(inp.trim()===""){delete state.results.overrides[matchId];}
  else{
    const mm=inp.match(/(\d+)\s*[:\-]\s*(\d+)/);
    if(!mm){alert("Bitte im Format 2:1 eingeben.");return;}
    state.results.overrides[matchId]={h:+mm[1],a:+mm[2]};
  }
  renderContent();queueSave(saveResults);
}

function adminPanel(){
  return `<div style="margin-top:16px">
    <div class="sub" style="margin-bottom:12px">Ergebnisse einzelner Spiele überschreibst du direkt in den Tabs „⚽ Gruppen" und „🏆 Finale"
      (dort erscheint im Spielleiter-Modus unter jedem Spiel „Ergebnis manuell setzen"). Hier trägst du die Extras ein:</div>
    <div class="card" style="padding:12px">
      <div style="font-weight:700;margin-bottom:6px">🏆 Weltmeister</div>
      <select onchange="setRealField('champion',this.value)">
        <option value="">—</option>
        ${ALL_TEAMS.map(x=>`<option ${state.results.champion===x?"selected":""} value="${x}">${x}</option>`).join("")}
      </select>
      <div style="font-weight:700;margin:12px 0 6px">👟 Torschützenkönig</div>
      <input value="${state.results.topScorer||""}" oninput="setRealField('topScorer',this.value)">
    </div>
    <div class="card" style="padding:12px">
      <div style="font-weight:700;margin-bottom:8px">😂 Lustige Fragen — Auflösung</div>
      ${FUN.map(fq=>`<div style="margin-bottom:8px">
        <div class="sub" style="font-size:12px;margin-bottom:2px">${fq.q}</div>
        <input value="${state.results["fun_"+fq.id]||""}" oninput="setRealField('fun_${fq.id}',this.value)"
          style="font-size:13px;padding:8px"></div>`).join("")}
    </div></div>`;
}
function setRealField(k,v){state.results[k]=v;queueSave(saveResults);}

// ── Start ─────────────────────────────────────────────────────
renderLogin();
</script>
